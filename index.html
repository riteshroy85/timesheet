<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timesheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timesheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1b1f24; --muted:#6a737d; --accent:#1f5c80; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#3a86b4; --ok:#3fb950; --err:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:380px; align-self:flex-start;
          box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .dots { display:flex; justify-content:center; gap:12px; margin:20px 0; min-height:16px; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { font-size:1.4rem; padding:16px 0; border-radius:12px; border:1px solid rgba(128,128,128,.3);
                background:transparent; color:var(--text); }
  .pad button:active { background:rgba(128,128,128,.2); }
  .row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(128,128,128,.2); }
  .row input { font-size:1.2rem; padding:6px; border-radius:8px; border:1px solid rgba(128,128,128,.4);
               background:transparent; color:var(--text); }
  .row input[type=number] { width:100px; text-align:right; }
  .val { font-size:1.2rem; font-weight:600; }
  .act { width:100%; padding:16px; margin-top:14px; font-size:1.05rem; font-weight:600; border:0; border-radius:12px;
         background:var(--accent); color:#fff; }
  .act.end { background:var(--ok); }
  .act.brk { background:#8250df; }
  .act:disabled { opacity:.5; }
  .link { background:none; border:0; color:var(--muted); margin-top:16px; width:100%; padding:8px; }
  #msg { min-height:1.3em; margin-top:12px; text-align:center; font-size:.9rem; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">

  <!-- PIN screen -->
  <div id="loginView">
    <h1>Timesheet</h1>
    <div class="muted">Enter your PIN</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>

  <!-- Day screen -->
  <div id="dayView" class="hidden">
    <h1 id="hello"></h1>
    <div class="muted" id="today"></div>
    <div class="row"><span>Start</span><span class="val" id="startVal">--:--</span></div>
    <div class="row"><span>End</span><span class="val" id="endVal">--:--</span></div>
    <div class="row"><span>Break</span><span class="val" id="breakVal">--</span></div>
    <div class="row"><span>Total hrs</span><span class="val" id="totalVal">--</span></div>
    <div class="row"><span>In-hrs</span><span class="val" id="inVal">--</span></div>
    <div class="row"><span class="muted">Time to record</span><input type="time" id="timeInput"></div>
    <button class="act" id="startBtn">Record start time</button>
    <button class="act end" id="endBtn">Record end time</button>
    <div class="row"><span class="muted">Break (minutes)</span><input type="number" id="breakInput" min="0" max="600" step="5" inputmode="numeric" placeholder="e.g. 45"></div>
    <button class="act brk" id="breakBtn">Save break</button>
    <button class="link" id="logout">Log out</button>
  </div>

  <div id="msg"></div>
</div>

<script>
  // Paste the Apps Script web app URL (ends in /exec) here after deploying.
  var API_URL = 'https://script.google.com/macros/s/AKfycbw1GHL3Ab7kp4SXshq3K42XZ2SRCbqjolfxHniZMwBYQ-Odcd27BWuUxaMOowmmLDJ_XQ/exec';

  var PIN_LEN_MAX = 8;
  var pin = '';
  var $ = function (id) { return document.getElementById(id); };

  // Random per-device id, used only for wrong-PIN lockout.
  var deviceId = (function () {
    try {
      var id = localStorage.getItem('deviceId');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('deviceId', id); }
      return id;
    } catch (e) { return 'unknown'; }
  })();

  // ---- keypad ----
  ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = k;
    b.onclick = function () { press(k); };
    $('pad').appendChild(b);
  });

  function press(k) {
    if (k === '⌫') pin = pin.slice(0, -1);
    else if (k === 'OK') return submitPin();
    else if (pin.length < PIN_LEN_MAX) pin += k;
    drawDots();
  }
  function drawDots() {
    $('dots').innerHTML = '';
    for (var i = 0; i < pin.length; i++) {
      var d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d);
    }
  }

  function msg(text, cls) { $('msg').textContent = text || ''; $('msg').className = cls || ''; }
  function nowHHmm() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // ---- API ----
  // text/plain keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
  function api(body) {
    body.pin = pin;
    body.deviceId = deviceId;
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error);
      return j.data;
    }).catch(function (e) {
      throw new Error(e instanceof TypeError ? 'No connection. Check your internet and try again.' : e.message);
    });
  }

  function submitPin() {
    if (!pin) return;
    msg('Checking…');
    api({ action: 'login' }).then(function (r) { msg(''); showDay(r); })
      .catch(function (e) { pin = ''; drawDots(); msg(e.message, 'err'); });
  }

  function showDay(r) {
    $('loginView').classList.add('hidden');
    $('dayView').classList.remove('hidden');
    $('hello').textContent = 'Hi, ' + r.name;
    $('today').textContent = new Date().toDateString();
    $('timeInput').value = nowHHmm();
    render(r.today);
  }
  function render(t) {
    $('startVal').textContent = t.start || '--:--';
    $('endVal').textContent = t.end || '--:--';
    $('breakVal').textContent = t.brk === '' ? '--' : t.brk + ' min';
    $('totalVal').textContent = t.total === '' ? '--' : t.total;
    $('inVal').textContent = t.inHrs === '' ? '--' : t.inHrs;
    if (t.brk !== '') $('breakInput').value = t.brk;
  }

  function setBusy(b) { $('startBtn').disabled = $('endBtn').disabled = $('breakBtn').disabled = b; }

  function record(kind, value) {
    if (value === '' || value == null) return msg(kind === 'break' ? 'Enter break minutes.' : 'Pick a time first.', 'err');
    setBusy(true);
    msg('Saving…');
    api({ action: 'record', kind: kind, value: value })
      .then(function (t) { render(t); msg('Saved ✓', 'ok'); })
      .catch(function (e) { msg(e.message, 'err'); })
      .then(function () { setBusy(false); });
  }
  $('startBtn').onclick = function () { record('start', $('timeInput').value); };
  $('endBtn').onclick = function () { record('end', $('timeInput').value); };
  $('breakBtn').onclick = function () { record('break', $('breakInput').value); };
  $('logout').onclick = function () {
    pin = ''; drawDots(); msg('');
    $('dayView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
