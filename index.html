<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timesheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timesheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1b1f24; --muted:#6a737d; --accent:#1f5c80; --ok:#1a7f37; --err:#cf222e; --line:rgba(128,128,128,.35); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#3a86b4; --ok:#3fb950; --err:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:380px; align-self:flex-start;
          box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  /* Lock-screen style PIN entry */
  .card.login { background:transparent; box-shadow:none; max-width:320px; text-align:center; padding:24px 0; }
  .card.login h1 { font-size:1.5rem; margin-top:24px; }
  .lock { width:44px; height:44px; margin:8px auto 0; color:var(--accent); }
  .dots { display:flex; justify-content:center; gap:18px; margin:28px 0 36px; min-height:14px; }
  .dots.shake { animation:shake .4s; }
  @keyframes shake { 20%,60% { transform:translateX(-10px); } 40%,80% { transform:translateX(10px); } }
  .dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--text); transition:background .1s; }
  .dot.on { background:var(--text); }
  .pad { display:grid; grid-template-columns:repeat(3,76px); gap:16px 24px; justify-content:center; user-select:none; -webkit-user-select:none; }
  .pad button { width:76px; height:76px; border-radius:50%; border:0; background:rgba(128,128,128,.18); color:var(--text);
                font-size:2rem; font-weight:300; line-height:1; padding:0; display:flex; flex-direction:column;
                align-items:center; justify-content:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
                font-family:inherit; transition:background .15s; }
  .pad button small { font-size:.6rem; font-weight:600; letter-spacing:2px; margin-top:2px; min-height:.7rem; color:var(--muted); }
  .pad button:active { background:rgba(128,128,128,.45); transition:none; }
  .pad button.ghost { background:transparent; font-size:1.5rem; }
  .pad button.ghost:active { background:rgba(128,128,128,.2); }
  .pad .spacer { visibility:hidden; }
  .unlock { margin-top:28px; padding:14px 48px; font-size:1.05rem; font-weight:600; border:0; border-radius:999px;
            background:var(--accent); color:#fff; font-family:inherit; touch-action:manipulation; }
  .unlock:disabled { opacity:.35; }

  label { display:block; margin-top:16px; font-size:.9rem; color:var(--muted); }
  input { display:block; width:100%; margin-top:6px; font-size:1.2rem; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:transparent; color:var(--text); font-family:inherit; min-height:50px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .save { width:100%; padding:16px; margin-top:22px; font-size:1.1rem; font-weight:600; border:0; border-radius:12px;
          background:var(--accent); color:#fff; }
  .save:disabled { opacity:.5; }
  .summary { margin-top:18px; padding:12px; border-radius:10px; background:rgba(128,128,128,.12); display:grid;
             grid-template-columns:1fr 1fr; gap:8px; text-align:center; }
  .summary b { display:block; font-size:1.3rem; }
  .link { background:none; border:0; color:var(--muted); margin-top:12px; width:100%; padding:8px; }
  #msg { min-height:1.3em; margin-top:12px; text-align:center; font-size:.95rem; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card login" id="card">

  <!-- PIN screen -->
  <div id="loginView">
    <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
    </svg>
    <h1>Timesheet</h1>
    <div class="muted" id="prompt">Enter your PIN</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <button class="unlock" id="unlock" disabled>Unlock</button>
    <button class="link" id="toRegister">First time? Register</button>
  </div>

  <!-- First-time registration -->
  <div id="registerView" class="hidden">
    <h1>Register</h1>
    <div class="muted">Create your PIN. You need the registration code from your admin.</div>

    <label for="regName">Your name</label>
    <input type="text" id="regName" autocomplete="name" maxlength="40">

    <label for="regEmail">Email</label>
    <input type="email" id="regEmail" autocomplete="email" autocapitalize="none" maxlength="80">

    <label for="regCode">Registration code</label>
    <input type="text" id="regCode" autocapitalize="characters" autocomplete="off" maxlength="20">

    <label for="regPin">Choose a PIN (4 to 8 digits)</label>
    <input type="password" id="regPin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password">

    <label for="regPin2">Confirm PIN</label>
    <input type="password" id="regPin2" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password">

    <button class="save" id="registerBtn">Create account</button>
    <button class="link" id="toLogin">Back to login</button>
  </div>

  <!-- Entry form -->
  <div id="formView" class="hidden">
    <h1 id="hello"></h1>
    <div class="muted">Enter your hours for the day</div>

    <label for="date">Date</label>
    <input type="date" id="date">

    <div class="two">
      <div><label for="start">Start time</label><input type="time" id="start"></div>
      <div><label for="end">End time</label><input type="time" id="end"></div>
    </div>

    <label for="brk">Total break (hours)</label>
    <input type="number" id="brk" min="0" max="24" step="0.25" inputmode="decimal" placeholder="e.g. 0.5 or 1.25">

    <button class="save" id="saveBtn">Save</button>

    <div class="summary" id="summary">
      <div><span class="muted">Total hrs</span><b id="totalVal">--</b></div>
      <div><span class="muted">In-hrs</span><b id="inVal">--</b></div>
    </div>

    <button class="link" id="logout">Log out</button>
  </div>

  <div id="msg"></div>
</div>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbw1GHL3Ab7kp4SXshq3K42XZ2SRCbqjolfxHniZMwBYQ-Odcd27BWuUxaMOowmmLDJ_XQ/exec';

  var PIN_LEN_MAX = 8;
  var pin = '';
  var $ = function (id) { return document.getElementById(id); };

  // Random per-device id, used only for wrong-PIN lockout.
  var deviceId = (function () {
    try {
      var id = localStorage.getItem('deviceId');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('deviceId', id); }
      return id;
    } catch (e) { return 'unknown'; }
  })();

  // ---- keypad ----
  var LETTERS = { '2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ' };
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function (k) {
    var b = document.createElement('button');
    if (k === '') { b.className = 'spacer'; b.disabled = true; }
    else if (k === '⌫') { b.className = 'ghost'; b.setAttribute('aria-label', 'Delete'); b.textContent = '⌫'; }
    else { b.innerHTML = k + '<small>' + (LETTERS[k] || '') + '</small>'; }
    b.onclick = function () { press(k); };
    $('pad').appendChild(b);
  });
  $('unlock').onclick = submitPin;

  function press(k) {
    if (k === '⌫') pin = pin.slice(0, -1);
    else if (pin.length < PIN_LEN_MAX) pin += k;
    if (navigator.vibrate) navigator.vibrate(8);
    drawDots();
  }
  // 4 outlined placeholders; they fill as you type and grow for longer PINs.
  function drawDots() {
    $('dots').innerHTML = '';
    for (var i = 0; i < Math.max(4, pin.length); i++) {
      var d = document.createElement('div'); d.className = i < pin.length ? 'dot on' : 'dot'; $('dots').appendChild(d);
    }
    $('unlock').disabled = pin.length === 0;
  }
  drawDots();

  // Desktop keyboard support.
  document.addEventListener('keydown', function (e) {
    if ($('loginView').classList.contains('hidden')) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('⌫');
    else if (e.key === 'Enter') submitPin();
  });

  function wrongPin(text) {
    pin = ''; drawDots(); msg(text, 'err');
    $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }

  function msg(text, cls) { $('msg').textContent = text || ''; $('msg').className = cls || ''; }

  // ---- API ----
  // text/plain keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
  function api(body) {
    body.pin = pin;
    body.deviceId = deviceId;
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error);
      return j.data;
    }).catch(function (e) {
      throw new Error(e instanceof TypeError ? 'No connection. Check your internet and try again.' : e.message);
    });
  }

  function submitPin() {
    if (!pin) return;
    msg('Checking…');
    api({ action: 'login' }).then(enter).catch(function (e) { wrongPin(e.message); });
  }

  // Switch between the login, register and entry screens.
  function show(view) {
    ['loginView', 'registerView', 'formView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== view); });
    $('card').classList.toggle('login', view === 'loginView');
    msg('');
  }

  function enter(r) {
    show('formView');
    $('hello').textContent = 'Hi, ' + r.name;
    $('date').value = r.entry.date;
    fill(r.entry);
  }

  $('toRegister').onclick = function () { pin = ''; drawDots(); show('registerView'); };
  $('toLogin').onclick = function () { show('loginView'); };

  $('registerBtn').onclick = function () {
    var p = $('regPin').value;
    if (!$('regName').value.trim()) return msg('Enter your name.', 'err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('regEmail').value.trim())) return msg('Enter a valid email address.', 'err');
    if (!$('regCode').value.trim()) return msg('Enter the registration code.', 'err');
    if (!/^\d{4,8}$/.test(p)) return msg('PIN must be 4 to 8 digits.', 'err');
    if (p !== $('regPin2').value) return msg('The two PINs do not match.', 'err');
    $('registerBtn').disabled = true;
    msg('Creating account…');
    api({ action: 'register', name: $('regName').value, email: $('regEmail').value, code: $('regCode').value, newPin: p })
      .then(function (r) {
        pin = p;  // signed in with the new PIN
        ['regName', 'regEmail', 'regCode', 'regPin', 'regPin2'].forEach(function (id) { $(id).value = ''; });
        enter(r);
      })
      .catch(function (e) { msg(e.message, 'err'); })
      .then(function () { $('registerBtn').disabled = false; });
  };

  function fill(en) {
    $('start').value = en.start;
    $('end').value = en.end;
    $('brk').value = en.brk;
    $('totalVal').textContent = en.total === '' ? '--' : en.total;
    $('inVal').textContent = en.inHrs === '' ? '--' : en.inHrs;
  }

  // Changing the date loads whatever was already saved for that day.
  $('date').onchange = function () {
    if (!$('date').value) return;
    msg('Loading…');
    api({ action: 'get', date: $('date').value })
      .then(function (en) { fill(en); msg(''); })
      .catch(function (e) { msg(e.message, 'err'); });
  };

  $('saveBtn').onclick = function () {
    if (!$('date').value) return msg('Pick a date.', 'err');
    if (!$('start').value) return msg('Enter a start time.', 'err');
    $('saveBtn').disabled = true;
    msg('Saving…');
    api({ action: 'save', date: $('date').value, start: $('start').value, end: $('end').value, breakHrs: $('brk').value })
      .then(function (en) { fill(en); msg('Saved ✓', 'ok'); })
      .catch(function (e) { msg(e.message, 'err'); })
      .then(function () { $('saveBtn').disabled = false; });
  };

  $('logout').onclick = function () {
    pin = ''; drawDots();
    show('loginView');
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
