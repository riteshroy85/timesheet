<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timesheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timesheet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1b1f24; --muted:#6a737d; --accent:#1f5c80; --ok:#1a7f37; --err:#cf222e; --line:rgba(128,128,128,.35); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#3a86b4; --ok:#3fb950; --err:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:380px; align-self:flex-start;
          box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .dots { display:flex; justify-content:center; gap:12px; margin:20px 0; min-height:16px; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { font-size:1.4rem; padding:16px 0; border-radius:12px; border:1px solid var(--line);
                background:transparent; color:var(--text); }
  .pad button:active { background:rgba(128,128,128,.2); }

  label { display:block; margin-top:16px; font-size:.9rem; color:var(--muted); }
  input { display:block; width:100%; margin-top:6px; font-size:1.2rem; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:transparent; color:var(--text); font-family:inherit; min-height:50px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .save { width:100%; padding:16px; margin-top:22px; font-size:1.1rem; font-weight:600; border:0; border-radius:12px;
          background:var(--accent); color:#fff; }
  .save:disabled { opacity:.5; }
  .summary { margin-top:18px; padding:12px; border-radius:10px; background:rgba(128,128,128,.12); display:grid;
             grid-template-columns:1fr 1fr; gap:8px; text-align:center; }
  .summary b { display:block; font-size:1.3rem; }
  .link { background:none; border:0; color:var(--muted); margin-top:12px; width:100%; padding:8px; }
  #msg { min-height:1.3em; margin-top:12px; text-align:center; font-size:.95rem; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">

  <!-- PIN screen -->
  <div id="loginView">
    <h1>Timesheet</h1>
    <div class="muted">Enter your PIN</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>

  <!-- Entry form -->
  <div id="formView" class="hidden">
    <h1 id="hello"></h1>
    <div class="muted">Enter your hours for the day</div>

    <label for="date">Date</label>
    <input type="date" id="date">

    <div class="two">
      <div><label for="start">Start time</label><input type="time" id="start"></div>
      <div><label for="end">End time</label><input type="time" id="end"></div>
    </div>

    <label for="brk">Total break (hours)</label>
    <input type="number" id="brk" min="0" max="24" step="0.25" inputmode="decimal" placeholder="e.g. 0.5 or 1.25">

    <button class="save" id="saveBtn">Save</button>

    <div class="summary" id="summary">
      <div><span class="muted">Total hrs</span><b id="totalVal">--</b></div>
      <div><span class="muted">In-hrs</span><b id="inVal">--</b></div>
    </div>

    <button class="link" id="logout">Log out</button>
  </div>

  <div id="msg"></div>
</div>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbw1GHL3Ab7kp4SXshq3K42XZ2SRCbqjolfxHniZMwBYQ-Odcd27BWuUxaMOowmmLDJ_XQ/exec';

  var PIN_LEN_MAX = 8;
  var pin = '';
  var $ = function (id) { return document.getElementById(id); };

  // Random per-device id, used only for wrong-PIN lockout.
  var deviceId = (function () {
    try {
      var id = localStorage.getItem('deviceId');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('deviceId', id); }
      return id;
    } catch (e) { return 'unknown'; }
  })();

  // ---- keypad ----
  ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = k;
    b.onclick = function () { press(k); };
    $('pad').appendChild(b);
  });

  function press(k) {
    if (k === '⌫') pin = pin.slice(0, -1);
    else if (k === 'OK') return submitPin();
    else if (pin.length < PIN_LEN_MAX) pin += k;
    drawDots();
  }
  function drawDots() {
    $('dots').innerHTML = '';
    for (var i = 0; i < pin.length; i++) {
      var d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d);
    }
  }

  function msg(text, cls) { $('msg').textContent = text || ''; $('msg').className = cls || ''; }

  // ---- API ----
  // text/plain keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
  function api(body) {
    body.pin = pin;
    body.deviceId = deviceId;
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error);
      return j.data;
    }).catch(function (e) {
      throw new Error(e instanceof TypeError ? 'No connection. Check your internet and try again.' : e.message);
    });
  }

  function submitPin() {
    if (!pin) return;
    msg('Checking…');
    api({ action: 'login' }).then(function (r) {
      msg('');
      $('loginView').classList.add('hidden');
      $('formView').classList.remove('hidden');
      $('hello').textContent = 'Hi, ' + r.name;
      $('date').value = r.entry.date;
      fill(r.entry);
    }).catch(function (e) { pin = ''; drawDots(); msg(e.message, 'err'); });
  }

  function fill(en) {
    $('start').value = en.start;
    $('end').value = en.end;
    $('brk').value = en.brk;
    $('totalVal').textContent = en.total === '' ? '--' : en.total;
    $('inVal').textContent = en.inHrs === '' ? '--' : en.inHrs;
  }

  // Changing the date loads whatever was already saved for that day.
  $('date').onchange = function () {
    if (!$('date').value) return;
    msg('Loading…');
    api({ action: 'get', date: $('date').value })
      .then(function (en) { fill(en); msg(''); })
      .catch(function (e) { msg(e.message, 'err'); });
  };

  $('saveBtn').onclick = function () {
    if (!$('date').value) return msg('Pick a date.', 'err');
    if (!$('start').value) return msg('Enter a start time.', 'err');
    $('saveBtn').disabled = true;
    msg('Saving…');
    api({ action: 'save', date: $('date').value, start: $('start').value, end: $('end').value, breakHrs: $('brk').value })
      .then(function (en) { fill(en); msg('Saved ✓', 'ok'); })
      .catch(function (e) { msg(e.message, 'err'); })
      .then(function () { $('saveBtn').disabled = false; });
  };

  $('logout').onclick = function () {
    pin = ''; drawDots(); msg('');
    $('formView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
